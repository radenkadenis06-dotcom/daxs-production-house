<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAXS Production House</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1e7bff;--mut:#cfe0ff;--line:rgba(120,170,255,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#020b24;color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Montserrat',Arial,sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse 80% 30% at 0% 12%,rgba(30,123,255,.45),transparent 70%),radial-gradient(ellipse 70% 25% at 100% 45%,rgba(30,123,255,.4),transparent 70%),radial-gradient(ellipse 90% 30% at 100% 100%,rgba(30,123,255,.5),transparent 70%),linear-gradient(180deg,#031038,#020a20 50%,#03123f)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 104px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
.logo{font-weight:900;font-size:24px;letter-spacing:-1px;line-height:.9}.logo small{display:block;font-size:6.5px;letter-spacing:0;font-weight:800}
.lang{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:rgba(10,30,80,.55)}
.lang button{padding:8px 15px;font-size:12px;font-weight:700;color:#9db6ea;background:none;border:0;cursor:pointer}
.lang button.on{background:var(--blue);color:#fff}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(3,14,48,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs a{flex:1;max-width:100px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:14px;font-size:10.5px;font-weight:600;color:#9db6ea;transition:.2s}
.tabs svg{width:22px;height:22px}
.tabs a.on{color:#fff;background:linear-gradient(180deg,rgba(40,120,255,.5),rgba(20,70,200,.25));box-shadow:0 0 16px rgba(30,123,255,.55),inset 0 0 0 1px rgba(130,180,255,.5)}
@media(min-width:760px){.tabs{position:static;margin:6px 0 22px;border:1px solid var(--line);border-radius:18px;padding:8px}.wrap{padding-bottom:40px}.tabs a{font-size:12px;flex-direction:row;justify-content:center;gap:8px;max-width:none}}
/* views */
.view{display:none}.view.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view.on{animation:none}}
.title{display:flex;align-items:center;gap:16px;justify-content:center;margin:18px 0 18px;font-weight:700;letter-spacing:.3em;font-size:clamp(17px,5vw,26px);font-style:italic}
.title::before,.title::after{content:"";height:1px;flex:1;max-width:70px;background:linear-gradient(90deg,transparent,#fff)}.title::after{transform:scaleX(-1)}
/* beranda */
.brand{text-align:center;margin-top:6px}
.brand h1{font-size:clamp(86px,25vw,150px);font-weight:900;letter-spacing:-.07em;line-height:.85;text-shadow:0 0 30px rgba(80,150,255,.45)}
.brand h2{font-size:clamp(26px,7.6vw,48px);font-weight:900;letter-spacing:-.05em;line-height:1;margin-top:4px}
.hp{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:200px;margin:10px 0 4px;background:radial-gradient(ellipse 60% 60% at 50% 55%,rgba(70,150,255,.5),transparent 72%)}
.hp img,.pic img{max-height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 0 12px rgba(80,160,255,.55)) drop-shadow(0 12px 14px rgba(0,0,0,.6))}
.hp img{max-width:48%}.hp img+img,.fade img{-webkit-mask-image:linear-gradient(180deg,#000 76%,transparent);mask-image:linear-gradient(180deg,#000 76%,transparent)}
.session{text-align:center}
.session h3{font-style:italic;font-weight:800;font-size:clamp(22px,6.6vw,38px);letter-spacing:.07em;text-shadow:0 0 18px rgba(80,150,255,.5)}
.session p{font-style:italic;font-size:clamp(13px,3.8vw,19px);margin-top:6px}
.offer{margin:20px auto 0;width:min(88%,440px);padding:11px 0;font-style:italic;font-weight:800;letter-spacing:.2em;font-size:clamp(14px,4.2vw,21px);background:linear-gradient(90deg,#0a3a9a,#1e7bff 50%,#0a3a9a);clip-path:polygon(5% 0,95% 0,100% 100%,0 100%);box-shadow:0 0 30px rgba(30,123,255,.8)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 14px}
.glass,.mc,form{border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,rgba(40,90,190,.38),rgba(5,20,70,.62));box-shadow:0 0 24px rgba(30,123,255,.25),inset 0 1px 0 rgba(160,200,255,.2)}
.mc{display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 8px}.mc svg{width:30px;height:30px}
.mc b{font-size:12px;letter-spacing:.15em;text-transform:uppercase}.mc span{font-weight:800;font-size:clamp(15px,4.6vw,20px)}
.btns{display:grid;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:40px;border:1px solid #6fb0ff;background:linear-gradient(180deg,rgba(40,110,255,.6),rgba(10,40,130,.65));color:#fff;font-weight:700;letter-spacing:.06em;font-size:clamp(14px,4vw,17px);box-shadow:0 0 25px rgba(30,123,255,.55);cursor:pointer}
.btn.ghost{background:rgba(10,30,80,.45);box-shadow:none;border-color:var(--line)}
/* layanan */
.grid{display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden;padding:0}
.grid div{padding:18px 4px 14px;text-align:center;font-size:clamp(10px,2.9vw,13px);font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-right:1px solid rgba(120,170,255,.25);border-bottom:1px solid rgba(120,170,255,.25);cursor:pointer;transition:background .2s}
.grid div:nth-child(3n){border-right:0}.grid div:nth-last-child(-n+3){border-bottom:0}
.grid div:hover,.grid div:active{background:rgba(60,130,255,.28)}
.grid svg{width:34px;height:34px;display:block;margin:0 auto 9px;color:#dff0ff;stroke-width:1.5}
.tip{text-align:center;font-size:12.5px;color:var(--mut);margin-top:14px;font-style:italic}
/* paket */
.card{overflow:hidden;margin-bottom:16px}
.pic{height:240px;display:grid;place-items:center;position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(ellipse 62% 58% at 50% 50%,rgba(70,150,255,.6),rgba(25,80,210,.2) 55%,transparent 78%),linear-gradient(180deg,rgba(255,255,255,.07),transparent 45%)}
.pic::after{content:"";position:absolute;left:18%;right:18%;bottom:12px;height:16px;background:radial-gradient(ellipse at center,rgba(0,0,0,.7),transparent 70%);filter:blur(5px)}
.pic img{position:relative;z-index:1;max-width:82%;max-height:88%}
.info{padding:18px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.head b{display:flex;align-items:center;gap:8px;font-size:clamp(15px,4.6vw,21px);letter-spacing:.05em;text-transform:uppercase}.head svg{width:28px;height:28px}
.head span{padding:5px 14px;border:1px solid rgba(130,180,255,.55);border-radius:20px;background:rgba(30,123,255,.25);font-weight:800;font-size:clamp(13px,4vw,18px)}
ul{list-style:none;margin-top:12px}
li{display:flex;gap:10px;align-items:flex-start;font-size:clamp(12px,3.5vw,15px);line-height:1.4;margin:8px 0}
li::before{content:"\2713";flex:none;width:18px;height:18px;border-radius:50%;background:#2a86ff;font-size:11px;font-weight:900;display:grid;place-items:center;margin-top:1px;box-shadow:0 0 8px rgba(60,140,255,.8)}
.quote{text-align:center;font-style:italic;font-weight:500;font-size:clamp(14px,4.3vw,26px);line-height:1.35;margin:26px 0 6px}.quote b{font-weight:800}
@media(min-width:560px){.card{display:grid;grid-template-columns:42% 1fr}.pic{height:auto;min-height:280px;border-bottom:0;border-right:1px solid var(--line)}}
/* booking */
.sub{text-align:center;font-size:clamp(12px,3.5vw,15px);color:var(--mut);margin:-6px 0 16px;line-height:1.5}
form{padding:18px;display:grid;gap:14px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;letter-spacing:.03em;min-width:0}
.hint{font-weight:400;color:#9db6ea;font-size:11px}
input,select{width:100%;min-width:0;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid rgba(120,170,255,.45);background:rgba(2,11,36,.75);color:#fff;font:inherit;font-weight:500;font-size:16px;outline:none;display:block}
input::placeholder{color:#7f97c8}input:focus,select:focus{border-color:#6fb0ff;box-shadow:0 0 0 3px rgba(30,123,255,.35)}
select option{background:#031038}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}@media(max-width:480px){.row{grid-template-columns:1fr}}
.err{display:none;color:#ffb4b4;font-size:13px;font-weight:600;line-height:1.4}
.notice{margin-top:16px;border:1px solid rgba(245,165,36,.55);border-radius:14px;padding:14px 16px;background:rgba(245,165,36,.08)}
.notice b{color:#ffc766;font-size:clamp(13px,3.8vw,16px);letter-spacing:.12em}
.notice li{display:block;position:relative;padding-left:30px;margin:10px 0;line-height:1.55}
.notice li::before{content:"!";position:absolute;left:0;top:2px;background:#f5a524;color:#1a1000;box-shadow:none}
/* kontak */
.soc{display:flex;justify-content:center;flex-wrap:wrap;gap:22px;padding:30px 16px}
.soc a{width:68px;height:68px;border-radius:18px;box-shadow:0 0 18px rgba(30,123,255,.45);transition:transform .2s}.soc a:hover,.soc a:active{transform:translateY(-4px)}
.soc img{width:100%;height:100%;display:block;border-radius:18px}

.brand h1{font-size:clamp(96px,31vw,172px);letter-spacing:-.05em;line-height:.82;text-shadow:0 0 40px rgba(80,150,255,.5)}
.brand h2{font-size:clamp(22px,7.4vw,44px);letter-spacing:-.03em;margin-top:6px}
.lens{margin:2px -16px 0;position:relative}
.lens img{display:block;width:100%;height:auto;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 58%,transparent 100%)}
@media(prefers-reduced-motion:no-preference){.lens img{animation:fl 7s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}}
.session{margin-top:-6px}
.session h3{font-size:clamp(26px,8.6vw,48px);line-height:1.15}
.session p{font-size:clamp(14px,4.2vw,20px);line-height:1.45;max-width:92%;margin:12px auto 0}
.pk{padding:20px 18px;margin-bottom:16px}
.pk .head b{font-size:clamp(14px,4.4vw,20px)}
.tag{display:inline-block;font-style:normal;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:20px;margin-top:14px}
.tag.g{background:rgba(40,160,80,.18);color:#6fe08f;border:1px solid rgba(80,200,120,.35)}
.tag.b{background:rgba(30,123,255,.22);color:#8fc2ff;border:1px solid rgba(110,170,255,.5)}
.pk.best{border-color:#6fb0ff;box-shadow:0 0 34px rgba(30,123,255,.55),inset 0 1px 0 rgba(160,200,255,.3)}
</style>
</head>

<div class="wrap">
<header class="top">
 <div class="logo">DAXS<small>PRODUCTION HOUSE</small></div>
